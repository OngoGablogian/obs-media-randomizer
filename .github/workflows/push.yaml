name: Push
run-name: ${{ github.ref_name }} push run
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag
        id: check
        run: |
          : Check Release Tag
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          # Accepts 1.2.3 or v1.2.3, plus -beta/-rc pre-releases (1.2.3-beta1).
          # The release keeps the tag as pushed; file names use the version
          # without the "v".
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          case "${version}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              ;;
            *)
              echo 'validTag=false' >> $GITHUB_OUTPUT
              echo "::warning::Tag '${tag}' is not a release version (expected 1.2.3 or v1.2.3), so no release was created"
              ;;
          esac
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Collect Release Files
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Collect Release Files
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s nullglob

          root_dir="$(pwd)"
          release_dir="${root_dir}/release-files"
          commit_hash="${GITHUB_SHA:0:9}"
          mkdir -p "${release_dir}"

          # Only the standard packages go on the release (no debug symbols or
          # sources), each as one zip named <plugin>-<version>-<platform>.zip:
          # the artifact name without its commit hash, e.g.
          # obs-media-randomizer-1.0.1-windows-x64-b7a638935 -> obs-media-randomizer-1.0.1-windows-x64.zip

          # Windows: the artifact is a folder in the OBS install layout, zip it once
          for dir in *-windows-x64-${commit_hash}/; do
            dir="${dir%/}"
            name="${dir%-${commit_hash}}"
            (cd "${dir}" && zip -qr "${release_dir}/${name}.zip" .)
          done

          # macOS: the .pkg installer, zipped
          # Ubuntu: the .deb package, zipped (debug symbols are a separate artifact)
          staging="$(mktemp -d)"
          for pattern in "*-macos-universal-${commit_hash}/;pkg" "*-ubuntu-*-x86_64-${commit_hash}/;deb"; do
            IFS=';' read -r dir_glob ext <<< "${pattern}"
            for dir in ${dir_glob}; do
              dir="${dir%/}"
              name="${dir%-${commit_hash}}"
              for file in "${dir}"/*.${ext}; do
                cp "${file}" "${staging}/${name}.${ext}"
                (cd "${staging}" && zip -q "${release_dir}/${name}.zip" "${name}.${ext}")
              done
            done
          done
          rm -rf "${staging}"

          ls -l "${release_dir}"
          missing=0
          for platform in windows-x64 macos-universal 'ubuntu-*-x86_64'; do
            files=("${release_dir}"/*-${platform}.zip)
            if (( ${#files[@]} == 0 )); then
              echo "::error::No ${platform} package found for the release"
              missing=1
            fi
          done
          exit ${missing}

      - name: Generate Checksums
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/release-files/*; do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: false
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.tag }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/release-files/*
